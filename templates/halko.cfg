{
  "controlunit": {
    "base_path": "/var/opt/halko",
    "tick_length": "6s",
    "network_interface": "eth0",
    "defaults": {
      "max_delta_heating": 10.0,
      "min_delta_heating": 5.0,
      "max_delta_acclimate": 3.0,
      "min_delta_acclimate": -1.0
    }
  },
  "power_unit": {
    "shelly_address": "http://localhost:8088",
    "cycle_length": "60s",
    "max_idle_time": "70s",
    "power_mapping": {
      "heater": 0,
      "steam": 1,
      "fan": 2
    }
  },
  "sensorunit": {
    "serial_device": "/dev/ttyUSB0",
    "baud_rate": 9600
  },
  "dbusunit": {
    "system_bus_socket": "/var/run/dbus/system_bus_socket"
  },
  "api_endpoints": {
    "controlunit": {
      "url": "http://localhost:8090",
      "engine": "/engine",
      "programs": "/programs",
      "status": "/status"
    },
    "sensorunit": {
      "url": "http://localhost:8093",
      "temperatures": "/temperatures",
      "display": "/display",
      "status": "/status"
    },
    "powerunit": {
      "url": "http://localhost:8092",
      "status": "/status",
      "power": "/power"
    },
    "dbusunit": {
      "url": "http://localhost:8094",
      "vpn": "/vpn",
      "power": "/power",
      "status": "/status"
    }
  }
}
