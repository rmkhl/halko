{
  "controlunit": {
    "base_path": "/var/opt/halko",
    "tick_length": "6s",
    "network_interface": "eth0",
    "defaults": {
      "deltas": {
        "heating": {
          "min_delta": 5.0,
          "max_delta": 10.0
        },
        "acclimate": {
          "min_delta": -1.0,
          "max_delta": 3.0
        }
      },
      "fan_power": 0,
      "steam_power": 0,
      "preheat_fan_power": 50,
      "max_target_temperature": 200,
      "steam_ceiling": 100,
      "sensor_timeout": "120s",
      "execution_log_interval": "60s"
    }
  },
  "power_unit": {
    "shelly_address": "http://localhost:8088",
    "cycle_length": "60s",
    "max_idle_time": "70s",
    "power_mapping": {
      "heater": 0,
      "steam": 1,
      "fan": 2
    }
  },
  "sensorunit": {
    "serial_device": "/dev/ttyUSB0",
    "baud_rate": 9600
  },
  "dbusunit": {
    "system_bus_socket": "/var/run/dbus/system_bus_socket"
  },
  "api_endpoints": {
    "controlunit": {
      "url": "http://localhost:8090",
      "engine": "/engine",
      "programs": "/programs",
      "status": "/status"
    },
    "sensorunit": {
      "url": "http://localhost:8093",
      "temperatures": "/temperatures",
      "die_temperatures": "/temperatures/die",
      "display": "/display",
      "status": "/status"
    },
    "powerunit": {
      "url": "http://localhost:8092",
      "status": "/status",
      "power": "/power"
    },
    "dbusunit": {
      "url": "http://localhost:8094",
      "vpn": "/vpn",
      "power": "/power",
      "status": "/status"
    }
  }
}
