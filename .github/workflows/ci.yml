name: CI

# Pull requests only. Pushing a branch on its own runs nothing - the suite is
# for reviewing proposed changes, not for every intermediate commit.
#
# ready_for_review is not one of the default activity types, and without it a
# pull request opened as a draft would never get a run: its opened and
# synchronize events are skipped as drafts, and marking it ready would fire
# nothing to replace them.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Allows re-running the suite by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CLAUDE.md pins the workspace at Go 1.26+. There is no committed go.work to
  # read a version from - it is generated by 'make prepare' and git-ignored.
  GO_VERSION: "1.26.x"
  # The install line documented by the Makefile's prepare target.
  GOLANGCI_LINT_VERSION: v2.12.1

jobs:
  # Always under the race detector: it runs the same assertions as a plain
  # test run and adds data-race detection, so a separate uninstrumented job
  # would only repeat work.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    # Drafts are work in progress; a manual dispatch has no pull request
    # attached, so it must not be filtered out by this.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - name: Cache Node.js and modules
        uses: actions/cache@v6
        with:
          path: |
            .nodejs
            node_modules
            webapp/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('Makefile', 'package.json', 'webapp/package-lock.json') }}
          restore-keys: node-${{ runner.os }}-

      - name: Prepare workspace
        run: make prepare

      # test-ci rather than test: the per-module test targets swallow failures
      # on purpose, so 'make test' can never fail a build.
      - name: Run tests with the race detector
        run: make test-ci GOTESTFLAGS=-race

  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    # Drafts are work in progress; a manual dispatch has no pull request
    # attached, so it must not be filtered out by this.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - name: Cache Node.js and modules
        uses: actions/cache@v6
        with:
          path: |
            .nodejs
            node_modules
            webapp/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('Makefile', 'package.json', 'webapp/package-lock.json') }}
          restore-keys: node-${{ runner.os }}-

      # prepare only warns when golangci-lint is missing, so install it here.
      # The script is fetched from the same tag as the binary it installs: the
      # copy on master carries checksums for whatever release is current, which
      # do not match an older pinned version.
      - name: Install golangci-lint
        run: |
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_LINT_VERSION}/install.sh" \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Prepare workspace
        run: make prepare

      # lint-ci rather than lint, for the same reason as test-ci above.
      - name: Run golangci-lint
        run: make lint-ci

  # The version constant is the source of truth for the release tag, so a PR
  # that changes behaviour without bumping it would land untagged. This job is
  # the only gating one that is about policy rather than correctness; the
  # 'no-release' label is the escape hatch for docs- and CI-only changes.
  version-bump:
    name: Version bump
    runs-on: ubuntu-latest
    # Only meaningful for a pull request: a manual dispatch has no base branch
    # to compare against, and drafts are work in progress.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
        with:
          # Comparing against the base branch needs its history, which the
          # default shallow clone does not fetch.
          fetch-depth: 0

      - name: Check the version constant was bumped
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-release') }}
        run: |
          set -euo pipefail
          read_version() { sed -nE 's/^const Version = "(.*)"$/\1/p' "$1"; }

          new=$(read_version types/version.go)
          if [ -z "$new" ]; then
            echo "::error::Could not read the version from types/version.go."
            exit 1
          fi

          base="origin/${{ github.base_ref }}"
          if ! git cat-file -e "$base:types/version.go" 2>/dev/null; then
            echo "types/version.go is new on this branch; introducing it at $new."
            exit 0
          fi

          old=$(git show "$base:types/version.go" | read_version /dev/stdin)
          if [ "$old" = "$new" ]; then
            echo "::error::types/version.go is unchanged at $old. Bump it (patch for fixes, minor for new or changed behaviour, major for a breaking API, config or program change), or add the 'no-release' label if this PR ships nothing. See CONTRIBUTING.md."
            exit 1
          fi

          echo "Version bumped: $old -> $new"

      - name: Report a skipped bump check
        if: ${{ contains(github.event.pull_request.labels.*.name, 'no-release') }}
        run: echo "Skipped by the 'no-release' label."

  webapp:
    name: Webapp and docs
    runs-on: ubuntu-latest
    # Drafts are work in progress; a manual dispatch has no pull request
    # attached, so it must not be filtered out by this.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - name: Cache Node.js and modules
        uses: actions/cache@v6
        with:
          path: |
            .nodejs
            node_modules
            webapp/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('Makefile', 'package.json', 'webapp/package-lock.json') }}
          restore-keys: node-${{ runner.os }}-

      - name: Prepare workspace
        run: make prepare

      - name: Lint markdown
        run: make lint-markdown-ci

      - name: Lint and typecheck webapp
        run: make lint-webapp

      # build-webapp generates the nginx config from /etc/opt/halko.cfg or a
      # local halko.cfg, neither of which exists here - halko.cfg is
      # git-ignored. The template is what a fresh install would get.
      - name: Provide a config for the nginx generation step
        run: cp templates/halko.cfg halko.cfg

      - name: Build webapp
        run: make build-webapp
