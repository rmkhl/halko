name: CI

on:
  pull_request:
  push:
    branches: [master]
  # Allows re-running the suite by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CLAUDE.md pins the workspace at Go 1.26+. There is no committed go.work to
  # read a version from - it is generated by 'make prepare' and git-ignored.
  GO_VERSION: "1.26.x"
  # The install line documented by the Makefile's prepare target.
  GOLANGCI_LINT_VERSION: v2.12.1

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - name: Cache Node.js and modules
        uses: actions/cache@v4
        with:
          path: |
            .nodejs
            node_modules
            webapp/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('Makefile', 'package.json', 'webapp/package-lock.json') }}
          restore-keys: node-${{ runner.os }}-

      # prepare is what generates go.work, which is git-ignored and so absent
      # from a fresh checkout. It also verifies GO_MODULES and the workspace
      # still agree - a module missing from that list silently drops out.
      - name: Prepare workspace
        run: make prepare

      # test-ci rather than test: the per-module test targets swallow failures
      # on purpose, so 'make test' can never fail a build.
      - name: Run tests
        run: make test-ci

  go-test-race:
    name: Go tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - name: Cache Node.js and modules
        uses: actions/cache@v4
        with:
          path: |
            .nodejs
            node_modules
            webapp/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('Makefile', 'package.json', 'webapp/package-lock.json') }}
          restore-keys: node-${{ runner.os }}-

      - name: Prepare workspace
        run: make prepare

      - name: Run tests with the race detector
        run: make test-ci GOTESTFLAGS=-race

  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - name: Cache Node.js and modules
        uses: actions/cache@v4
        with:
          path: |
            .nodejs
            node_modules
            webapp/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('Makefile', 'package.json', 'webapp/package-lock.json') }}
          restore-keys: node-${{ runner.os }}-

      # prepare only warns when golangci-lint is missing, so install it here.
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Prepare workspace
        run: make prepare

      # lint-ci rather than lint, for the same reason as test-ci above.
      - name: Run golangci-lint
        run: make lint-ci

  webapp:
    name: Webapp and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - name: Cache Node.js and modules
        uses: actions/cache@v4
        with:
          path: |
            .nodejs
            node_modules
            webapp/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('Makefile', 'package.json', 'webapp/package-lock.json') }}
          restore-keys: node-${{ runner.os }}-

      - name: Prepare workspace
        run: make prepare

      - name: Lint markdown
        run: make lint-markdown-ci

      - name: Lint and typecheck webapp
        run: make lint-webapp

      # build-webapp generates the nginx config from /etc/opt/halko.cfg or a
      # local halko.cfg, neither of which exists here - halko.cfg is
      # git-ignored. The template is what a fresh install would get.
      - name: Provide a config for the nginx generation step
        run: cp templates/halko.cfg halko.cfg

      - name: Build webapp
        run: make build-webapp
